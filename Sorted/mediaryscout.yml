services:
  postgres:
    image: postgres:16-alpine
    container_name: mediaryscout-postgres
    ports:
      - 5432:5432
    volumes:
      - /vol1/1000/Docker/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=mediaryscout
      - POSTGRES_USER=mediaryscout
      - POSTGRES_PASSWORD=mediaryscout
    restart: always
    networks:
      - mediaryscout-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaryscout -d mediaryscout"]
      interval: 5s
      timeout: 3s
      retries: 12

  pansou-web:
    image: ghcr.io/fish2018/pansou-web:latest
    container_name: pansou-web
    ports:
      - 8888:80
    volumes:
      - /vol1/1000/Docker/pansou-web:/app/data
    environment:
      - PANSOU_PORT=8888
      - CACHE_PATH=/app/data/cache
      - LOG_PATH=/app/data/logs
    restart: always
    networks:
      - mediaryscout-network

  mediaryscout:
    image: mediaryscout:v1.4.1
    container_name: mediaryscout
    ports:
      - 3000:3000
    environment:
      - MEDIA_TRACK_POSTGRES_URL=postgres://mediaryscout:mediaryscout@127.0.0.1:5432/mediaryscout
      - PANSOU_BASE_URL=http://127.0.0.1:8888
      - MEDIA_TRACK_SEARCH_PROVIDER=tmdb
      - MEDIA_TRACK_WORKFLOW_ADAPTER=pansou
      - MEDIA_TRACK_STORAGE_ADAPTER=115
      - MEDIA_TRACK_AGENT_ADAPTER=vercel-ai
      - MEDIA_TRACK_DEMO_SEED=0
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - mediaryscout-network
    depends_on:
      postgres:
        condition: service_healthy
      pansou-web:
        condition: service_started

networks:
  mediaryscout-network:
    external: true
    name: mediaryscout
